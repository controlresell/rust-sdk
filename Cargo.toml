[package]
name = "controlresell-sdk"
version = "1.0.0"
edition = "2021"
description = "Rust SDK for the ControlResell public API"
license = "Apache-2.0"
authors = ["NathanFallet <contact@nathanfallet.me>"]
repository = "https://github.com/controlresell/rust-sdk"
homepage = "https://controlresell.com"
readme = "README.md"
keywords = ["controlresell", "api", "sdk", "resale", "vinted"]
categories = ["api-bindings"]
exclude = ["/.github", "/scripts", "/tools", "/.spec-sha256"]

[lib]
name = "controlresell"
path = "src/lib.rs"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures-util = { version = "0.3", default-features = false }
http = "1"
progenitor-client = "0.15"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
